# 酷安 iOS 16.7.3 页面广告净化（Quantumult X 远程重写片段）
# 远程重写资源格式：直接写 hostname 和规则，不包含 [rewrite_local] / [MITM] 区块头。
# 需要在 Quantumult X 中启用重写、MITM，并安装/信任证书。

hostname = api.coolapk.com

# 搜索热搜广告位
^https:\/\/api\.coolapk\.com\/v6\/search\?.*type=hotSearch url reject-200

# 启动配置、首页信息流、首页模块、帖子详情、回复列表、页面卡片、我的页面卡片
^https:\/\/api\.coolapk\.com\/v6\/main\/init(?:\?|$) url script-response-body https://raw.githubusercontent.com/5mdd4jtp9p-star/quanX/main/coolapk-ads-16.7.3.js
^https:\/\/api\.coolapk\.com\/v6\/main\/dataList(?:\?|$) url script-response-body https://raw.githubusercontent.com/5mdd4jtp9p-star/quanX/main/coolapk-ads-16.7.3.js
^https:\/\/api\.coolapk\.com\/v6\/main\/indexV8(?:\?|$) url script-response-body https://raw.githubusercontent.com/5mdd4jtp9p-star/quanX/main/coolapk-ads-16.7.3.js
^https:\/\/api\.coolapk\.com\/v6\/feed\/detail(?:\?|$) url script-response-body https://raw.githubusercontent.com/5mdd4jtp9p-star/quanX/main/coolapk-ads-16.7.3.js
^https:\/\/api\.coolapk\.com\/v6\/feed\/replyList(?:\?|$) url script-response-body https://raw.githubusercontent.com/5mdd4jtp9p-star/quanX/main/coolapk-ads-16.7.3.js
^https:\/\/api\.coolapk\.com\/v6\/page\/dataList(?:\?|$) url script-response-body https://raw.githubusercontent.com/5mdd4jtp9p-star/quanX/main/coolapk-ads-16.7.3.js
^https:\/\/api\.coolapk\.com\/v6\/account\/loadConfig\?.*key=my_page_card_config url script-response-body https://raw.githubusercontent.com/5mdd4jtp9p-star/quanX/main/coolapk-ads-16.7.3.js
